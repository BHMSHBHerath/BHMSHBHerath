<svg xmlns="http://www.w3.org/2000/svg" width="960" height="145" viewBox="0 0 960 145" role="img" aria-labelledby="title desc">
<title id="title">Animated IoT network data flow</title><desc id="desc">Data pulses travel from sensors through an edge gateway to a network and an AI analysis block</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="0"><stop stop-color="#07101f"/><stop offset=".5" stop-color="#0d2340"/><stop offset="1" stop-color="#071526"/></linearGradient>
</defs>
<rect width="960" height="145" rx="13" fill="url(#bg)" />
<rect x="1" y="1" width="958" height="143" rx="12" stroke="#1d5485" stroke-opacity=".65" fill="none"/>
<g stroke="#195182" stroke-width="1" opacity=".35"><path d="M0 30H960M0 72H960M0 112H960"/></g>
<g stroke="#258acb" stroke-width="2.5" fill="none" opacity=".65">
 <path d="M190 63H330" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur="2s" repeatCount="indefinite"/></path>
 <path d="M480 63H620" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur="2s" repeatCount="indefinite"/></path>
 <path d="M770 63H840" stroke-dasharray="8 9"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur="2s" repeatCount="indefinite"/></path>
</g>
<g fill="none" stroke="#31c1ff" stroke-width="2.5">
 <rect x="52" y="38" width="138" height="51" rx="14" stroke="#1d77d8"/>
 <rect x="330" y="38" width="150" height="51" rx="14" stroke="#1d77d8"/>
 <rect x="620" y="38" width="150" height="51" rx="14" stroke="#1d77d8"/>
 <rect x="840" y="38" width="82" height="51" rx="14" stroke="#1d77d8"/>
</g>
<g font-size="17" font-family="Arial,DejaVu Sans,sans-serif" font-weight="600" fill="#e1f4ff" text-anchor="middle">
 <text x="121" y="69">SENSORS</text><text x="405" y="69">EDGE / IoT</text>
 <text x="695" y="69">NETWORK</text><text x="881" y="69">AI</text>
</g>
<g fill="#55e7ff">
 <circle r="5"><animateMotion path="M190 63H330" dur="2.7s" repeatCount="indefinite"/></circle>
 <circle r="5"><animateMotion path="M480 63H620" dur="2.4s" begin=".7s" repeatCount="indefinite"/></circle>
 <circle r="5"><animateMotion path="M770 63H840" dur="1.6s" begin="1.1s" repeatCount="indefinite"/></circle>
</g>
<g font-size="12" font-family="monospace" letter-spacing="1.8" fill="#74b7df" text-anchor="middle">
 <text x="121" y="111">ACQUISITION</text><text x="405" y="111">PROCESSING</text><text x="695" y="111">COMMUNICATION</text><text x="881" y="111">ANALYTICS</text>
</g>
<g font-family="monospace" font-size="11" fill="#34d6ff">
 <text x="29" y="22">● SIGNAL FLOW</text><text x="753" y="132">TELECOM · EMBEDDED · AI</text>
</g>
</svg>